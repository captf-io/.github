<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-labelledby="t d">
  <title id="t">captf-io.github.io</title>
  <desc id="d">The captf.io landing page</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0D1C"/>
      <stop offset="1" stop-color="#121735"/>
    </linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A974FF"/>
      <stop offset="0.55" stop-color="#5B8CFF"/>
      <stop offset="1" stop-color="#FFD84D"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A974FF"/>
      <stop offset="1" stop-color="#5B8CFF"/>
    </linearGradient>
    <radialGradient id="gP"><stop offset="0" stop-color="#7B42BC" stop-opacity=".7"/><stop offset="1" stop-color="#7B42BC" stop-opacity="0"/></radialGradient>
    <radialGradient id="gB"><stop offset="0" stop-color="#326CE5" stop-opacity=".65"/><stop offset="1" stop-color="#326CE5" stop-opacity="0"/></radialGradient>
    <radialGradient id="gY"><stop offset="0" stop-color="#FFDA18" stop-opacity=".3"/><stop offset="1" stop-color="#FFDA18" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="260" rx="28"/></clipPath>
    <style>
      .sans { font-family: Inter, "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      @keyframes breathe { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
      @keyframes spin { to { transform: rotate(360deg) } }
      @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
      @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
      .glow { animation: breathe 7s ease-in-out infinite; }
      .glow2 { animation: breathe 9s ease-in-out infinite -3s; }
      .spin { transform-box: fill-box; transform-origin: center; animation: spin 14s linear infinite; }
      .n1 { animation: pulse 2.4s ease-in-out infinite; }
      .n2 { animation: pulse 2.4s ease-in-out infinite .4s; }
      .n3 { animation: pulse 2.4s ease-in-out infinite .8s; }
      .n4 { animation: pulse 2.4s ease-in-out infinite 1.2s; }
      .cursor { animation: blink 1.1s step-end infinite; }
      .tile { fill: #141A38; }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <rect width="1200" height="260" fill="url(#grid)"/>
    <circle class="glow" cx="980" cy="10" r="330" fill="url(#gP)"/>
    <circle class="glow2" cx="1190" cy="270" r="290" fill="url(#gB)"/>
    <circle class="glow" cx="90" cy="300" r="230" fill="url(#gY)"/>

    <g class="sans">
      <rect x="64" y="54" width="213" height="34" rx="16" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".14"/>
      <path d="M85 61 93.7 66v10L85 81 76.3 76V66Z" fill="none" stroke="url(#wire)" stroke-width="2.4" stroke-linejoin="round"/>
      <circle cx="85" cy="71" r="3" fill="#FFD84D"/>
      <text x="105" y="76" font-size="14" font-weight="600" letter-spacing="1.6" fill="#C9D1F0">CAPTF · WEBSITE</text>

      <text x="62" y="164" font-size="64" font-weight="800" letter-spacing="-1.5" fill="url(#hl)">captf-io.github.io</text>
      <text x="64" y="212" font-size="23" fill="#AAB3D6">The captf.io landing page</text>
    </g>

    <g transform="translate(1040 130) scale(1.25)">
      <!-- The website: a browser window around the CAPTF mark. -->
      <rect class="tile" x="-60" y="-60" width="120" height="120" rx="20" stroke="#5B8CFF" stroke-opacity=".8"/>
      <rect x="-38" y="-30" width="76" height="60" rx="8" fill="none" stroke="#8FB0FF" stroke-width="2.5"/>
      <path d="M-38 -16H38" stroke="#8FB0FF" stroke-width="2.5"/>
      <circle cx="-30" cy="-23" r="2.2" fill="#A974FF"/>
      <circle cx="-23" cy="-23" r="2.2" fill="#5B8CFF"/>
      <circle cx="-16" cy="-23" r="2.2" fill="#FFD84D"/>
      <path d="M0 -6 12.1 1v14L0 22-12.1 15V1Z" fill="none" stroke="url(#wire)" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="0" cy="8" r="4" fill="#FFD84D"/>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="259" rx="28" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
</svg>
