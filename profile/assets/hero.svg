<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="t d">
  <title id="t">CAPTF: your Terraform modules are the provider</title>
  <desc id="d">Cluster API Provider Terraform runs Terraform and OpenTofu modules as Kubernetes Jobs to build clusters, machines and machine pools on any platform.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0D1C"/>
      <stop offset="1" stop-color="#121735"/>
    </linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A974FF"/>
      <stop offset="0.55" stop-color="#5B8CFF"/>
      <stop offset="1" stop-color="#FFD84D"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A974FF"/>
      <stop offset="1" stop-color="#5B8CFF"/>
    </linearGradient>
    <radialGradient id="gP"><stop offset="0" stop-color="#7B42BC" stop-opacity=".75"/><stop offset="1" stop-color="#7B42BC" stop-opacity="0"/></radialGradient>
    <radialGradient id="gB"><stop offset="0" stop-color="#326CE5" stop-opacity=".7"/><stop offset="1" stop-color="#326CE5" stop-opacity="0"/></radialGradient>
    <radialGradient id="gY"><stop offset="0" stop-color="#FFDA18" stop-opacity=".35"/><stop offset="1" stop-color="#FFDA18" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="440" rx="28"/></clipPath>
    <style>
      .sans { font-family: Inter, "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      @keyframes breathe { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
      @keyframes flow { to { stroke-dashoffset: -40 } }
      @keyframes spin { to { transform: rotate(360deg) } }
      @keyframes up {
        0%, 12% { fill: #1C2346; stroke: #2E3766 }
        22%, 88% { fill: #1E3A7A; stroke: #5B8CFF }
        100% { fill: #1C2346; stroke: #2E3766 }
      }
      @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
      .glow { animation: breathe 7s ease-in-out infinite; }
      .glow2 { animation: breathe 9s ease-in-out infinite -3s; }
      .wire { stroke-dasharray: 6 14; animation: flow 1.2s linear infinite; }
      .wheel { transform-origin: 876px 214px; animation: spin 14s linear infinite; }
      .node { animation: up 6s ease-in-out infinite; }
      .cursor { animation: blink 1.1s step-end infinite; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="440" fill="url(#bg)"/>
    <rect width="1200" height="440" fill="url(#grid)"/>
    <circle class="glow" cx="930" cy="40" r="360" fill="url(#gP)"/>
    <circle class="glow2" cx="1180" cy="420" r="320" fill="url(#gB)"/>
    <circle class="glow" cx="120" cy="470" r="260" fill="url(#gY)"/>

    <!-- Copy -->
    <g class="sans">
      <rect x="64" y="64" width="372" height="32" rx="16" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".14"/>
      <circle cx="84" cy="80" r="5" fill="#4ADE80"/>
      <text x="98" y="85" font-size="13" font-weight="600" letter-spacing="1.6" fill="#C9D1F0">CLUSTER API · TERRAFORM · OPENTOFU</text>

      <text x="62" y="170" font-size="54" font-weight="800" letter-spacing="-1.5" fill="#FFFFFF">Your modules</text>
      <text x="62" y="234" font-size="54" font-weight="800" letter-spacing="-1.5" fill="url(#hl)">are the provider.</text>

      <text x="64" y="288" font-size="19" fill="#AAB3D6">Turn the Terraform and OpenTofu you already trust</text>
      <text x="64" y="316" font-size="19" fill="#AAB3D6">into Kubernetes clusters, on any platform.</text>

      <text x="64" y="376" font-size="30" font-weight="800" letter-spacing="3" fill="#FFFFFF">CAPTF</text>
      <text x="186" y="376" font-size="15" fill="#7F89B5">Cluster API Provider Terraform</text>
    </g>

    <!-- Visual: module → Job → cluster -->
    <g transform="translate(0,0)">
      <!-- module card -->
      <rect x="664" y="130" width="140" height="168" rx="14" fill="#141A38" stroke="#A974FF" stroke-opacity=".6"/>
      <text x="680" y="156" class="mono" font-size="13" fill="#A974FF">main.tf</text>
      <g class="mono" font-size="11.5">
        <text x="680" y="184" fill="#5B8CFF">module</text><text x="730" y="184" fill="#FFD84D">"vpc"</text>
        <text x="680" y="204" fill="#5B8CFF">resource</text>
        <text x="690" y="222" fill="#C9D1F0">"server"</text>
        <text x="680" y="242" fill="#5B8CFF">output</text>
        <text x="690" y="260" fill="#C9D1F0">"endpoint"</text>
        <rect class="cursor" x="680" y="270" width="7" height="13" fill="#C9D1F0"/>
      </g>

      <!-- wire 1 -->
      <path class="wire" d="M806 214H824" stroke="url(#wire)" stroke-width="3" stroke-linecap="round" fill="none"/>

      <!-- Job wheel (heptagon, a nod to Kubernetes) -->
      <g>
        <circle cx="876" cy="214" r="50" fill="#1A2350" stroke="#5B8CFF" stroke-width="2"/>
        <g class="wheel" stroke="#8FB0FF" stroke-width="3" stroke-linecap="round">
          <line x1="876" y1="214" x2="876" y2="180"/>
          <line x1="876" y1="214" x2="902.6" y2="192.8"/>
          <line x1="876" y1="214" x2="909.1" y2="221.6"/>
          <line x1="876" y1="214" x2="890.8" y2="244.6"/>
          <line x1="876" y1="214" x2="861.2" y2="244.6"/>
          <line x1="876" y1="214" x2="842.9" y2="221.6"/>
          <line x1="876" y1="214" x2="849.4" y2="192.8"/>
          <circle cx="876" cy="214" r="34" fill="none" stroke-width="2.5"/>
        </g>
        <circle cx="876" cy="214" r="9" fill="#5B8CFF"/>
        <text x="876" y="318" class="sans" font-size="13" font-weight="600" fill="#8FB0FF" text-anchor="middle">Job</text>
      </g>

      <!-- wire 2 -->
      <path class="wire" d="M928 214H958" stroke="url(#wire)" stroke-width="3" stroke-linecap="round" fill="none"/>

      <!-- cluster: 3x3 nodes lighting up -->
      <g stroke-width="1.5" fill="#1C2346" stroke="#2E3766">
        <rect class="node" x="964" y="138" width="44" height="44" rx="9" style="animation-delay:0s"/>
        <rect class="node" x="1016" y="138" width="44" height="44" rx="9" style="animation-delay:.25s"/>
        <rect class="node" x="1068" y="138" width="44" height="44" rx="9" style="animation-delay:.5s"/>
        <rect class="node" x="964" y="190" width="44" height="44" rx="9" style="animation-delay:.75s"/>
        <rect class="node" x="1016" y="190" width="44" height="44" rx="9" style="animation-delay:1s"/>
        <rect class="node" x="1068" y="190" width="44" height="44" rx="9" style="animation-delay:1.25s"/>
        <rect class="node" x="964" y="242" width="44" height="44" rx="9" style="animation-delay:1.5s"/>
        <rect class="node" x="1016" y="242" width="44" height="44" rx="9" style="animation-delay:1.75s"/>
        <rect class="node" x="1068" y="242" width="44" height="44" rx="9" style="animation-delay:2s"/>
      </g>
      <text x="1038" y="318" class="sans" font-size="13" font-weight="600" fill="#8FB0FF" text-anchor="middle">Cluster</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="439" rx="28" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
</svg>
